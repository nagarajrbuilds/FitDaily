name: Build Installable APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FITDAILY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FITDAILY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FITDAILY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FITDAILY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "FITDAILY_KEYSTORE_B64 is missing" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "FITDAILY_STORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "FITDAILY_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "FITDAILY_KEY_PASSWORD is missing" && exit 1)
      - name: Decode permanent FitDaily signing key
        env:
          KEYSTORE_B64: ${{ secrets.FITDAILY_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fitdaily.jks"
      - name: Build permanently signed APK
        env:
          FITDAILY_KEYSTORE: ${{ runner.temp }}/fitdaily.jks
          FITDAILY_STORE_PASSWORD: ${{ secrets.FITDAILY_STORE_PASSWORD }}
          FITDAILY_KEY_ALIAS: ${{ secrets.FITDAILY_KEY_ALIAS }}
          FITDAILY_KEY_PASSWORD: ${{ secrets.FITDAILY_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: FitDaily-v2.11-signed
          path: app/build/outputs/apk/release/app-release.apk
